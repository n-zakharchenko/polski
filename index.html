<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rajd Polskiej Gramatyki</title>
  <!-- версия сайта: метка ?v= у всех наших файлов (защита от кэша); меняет tools/bump-version.js -->
  <script>window.POLSKI_V = '20261105-1714';</script>
  <link rel="icon" href="favicon.svg?v=20261105-1714" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261105-1714">
  <!-- стили оформления (Styl в настройках): включается тот, что в <html data-design> -->
  <link rel="stylesheet" href="designs/01-retro-pastel.css?v=20261105-1714">
  <link rel="stylesheet" href="designs/02-gazeta.css?v=20261105-1714">
  <script src="core/settings.js?v=20261105-1714"></script> <!-- тема — до отрисовки; шестерёнка настроек -->
  <script src="core/account.js?v=20261105-1714" defer></script> <!-- вход через Google; без входа Firebase не грузится -->
  <script src="core/progress.js?v=20261105-1714" defer></script> <!-- очки в Firestore -->
  <script src="designs/02-gazeta.js?v=20261105-1714" defer></script> <!-- шапка газеты (стиль «Gazeta») -->
</head>
<body>
  <main>
    <!-- одна страница и для главной, и для раздела: index.html?g=<id раздела> -->
    <a class="back" id="back" href="index.html" hidden>← Wstecz</a>
    <h1 id="title">Rajd Polskiej Gramatyki</h1>
    <p class="subtitle" id="subtitle">Wybierz test</p>

    <!-- карточки строятся из tests/manifest.js -->
    <nav class="test-list" id="test-list"></nav>

    <!-- экран выбора — если у раздела есть chooser -->
    <div class="chooser card" id="chooser" hidden></div>

    <!-- карта путешествия малюхом (journey/journey.js); только на главной, под тестами -->
    <section class="journey card" id="journey" hidden></section>

    <footer class="site-footer">
      <a href="privacy.html">Polityka prywatności</a>
    </footer>
  </main>

  <script src="core/engine.js?v=20261105-1714"></script>
  <script src="core/ui.js?v=20261105-1714"></script>
  <script src="tests/manifest.js?v=20261105-1714"></script>
  <script src="core/balance.js?v=20261105-1714"></script>
  <script src="journey/route.js?v=20261105-1714"></script>
  <script src="journey/poland.js?v=20261105-1714"></script>
  <script src="journey/rivers.js?v=20261105-1714"></script>
  <script src="journey/journey.js?v=20261105-1714"></script>
  <script>
    // локальный дебаг карты (малюх, маршрут, окна городов): на localhost всегда, кроме превью сравнения
    // и страниц разделов (там нет карты); файла dev/debug.js на сайте нет (.gitignore)
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&](compare|g=)/.test(location.search)) {
      var dbg = document.createElement('script');
      dbg.src = 'dev/debug.js?t=' + Date.now();
      document.head.appendChild(dbg);
    }
  </script>
  <script>
    (function () {
      var list = document.getElementById('test-list');
      var el = Polski.ui.el;
      var groupId = new URLSearchParams(location.search).get('g');
      var items = Polski.manifest;

      if (groupId) {
        document.getElementById('journey').remove(); // карта — только на главной
        var path = Polski.findPath(groupId);
        var group = path && path[path.length - 1];
        if (!group || !Polski.isGroup(group)) {
          Polski.ui.showError(list, 'Nie ma takiego działu: ' + groupId);
          return;
        }
        items = group.items;
        var parent = path[path.length - 2];
        var back = document.getElementById('back');
        back.href = parent ? 'index.html?g=' + encodeURIComponent(parent.id) : 'index.html';
        back.hidden = false;
        document.title = group.title + ' — Rajd Polskiej Gramatyki';
        document.getElementById('title').textContent = group.title;

        if (group.chooser) {
          renderChooser(group);
          return;
        }
      }

      /* ---------- экран выбора: ряды кнопок + «Start», выбор запоминается ---------- */

      function renderChooser(group) {
        var cfg = group.chooser;
        var key = 'polski.choice.' + group.id;
        var box = document.getElementById('chooser');
        document.getElementById('subtitle').textContent = 'Wybierz, co chcesz ćwiczyć';
        list.hidden = true;
        box.hidden = false;

        var choice = {};
        try { choice = JSON.parse(window.localStorage.getItem(key)) || {}; } catch (e) { choice = {}; }
        cfg.axes.forEach(function (axis) {
          var valid = axis.options.some(function (o) { return o.id === choice[axis.key]; });
          if (!valid) choice[axis.key] = axis.options[0].id; // по умолчанию — первый вариант
        });

        function save() {
          try { window.localStorage.setItem(key, JSON.stringify(choice)); } catch (e) { /* не страшно */ }
        }

        function render() {
          var testId = cfg.tests[cfg.axes.map(function (a) { return choice[a.key]; }).join('.')];
          box.replaceChildren(el('div', {}, cfg.axes.map(function (axis) {
            var selected = axis.options.filter(function (o) { return o.id === choice[axis.key]; })[0];
            return el('div', { class: 'chooser-axis' }, [
              el('div', { class: 'chooser-label', text: axis.label }),
              el('div', { class: 'seg', role: 'group', 'aria-label': axis.label }, axis.options.map(function (o) {
                var active = o.id === choice[axis.key];
                return el('button', {
                  class: 'seg-btn' + (active ? ' active' : ''), type: 'button',
                  'aria-pressed': active ? 'true' : 'false', text: o.title,
                  onclick: function () { choice[axis.key] = o.id; save(); render(); },
                });
              })),
              selected && selected.hint ? el('div', { class: 'chooser-hint', text: selected.hint }) : null,
            ]);
          }).concat([
            el('a', {
              class: 'btn btn-wide chooser-start',
              href: 'test.html?id=' + encodeURIComponent(testId),
              text: 'Start',
            }),
          ])));
        }

        render();
      }

      function card(href, info, soon) {
        return el(soon ? 'div' : 'a', {
          class: 'test-card' + (soon ? ' soon' : ''),
          href: soon ? null : href,
          'aria-disabled': soon ? 'true' : null,
        }, [
          el('span', { class: 'test-icon', text: info.icon || '' }),
          el('span', { class: 'test-text' }, [
            el('span', { class: 'test-title', text: info.title }),
            info.desc ? el('span', { class: 'test-desc', text: info.desc }) : null,
          ]),
          soon
            ? el('span', { class: 'badge', text: 'Wkrótce' })
            : el('span', { class: 'test-arrow', 'aria-hidden': 'true', text: '→' }),
        ]);
      }

      Polski.loadBundles('', items).then(function () {
        items.forEach(function (entry) {
          if (Polski.isGroup(entry)) {
            list.appendChild(card('index.html?g=' + encodeURIComponent(entry.id), entry, false));
            return;
          }
          var t = Polski.tests[entry.id];
          if (!t) return;
          list.appendChild(card('test.html?id=' + encodeURIComponent(t.id), t, t.soon));
        });
        // на главной — заглушка «скоро будут новые тесты» (неактивная)
        if (!groupId) {
          list.appendChild(card(null, { icon: '✨', title: 'Nowe testy', desc: 'Kolejne tematy są w drodze' }, true));
        }
      }).catch(function (err) {
        Polski.ui.showError(list, err);
      });
    })();
  </script>
</body>
</html>
