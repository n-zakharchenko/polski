<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test — Rajd Polskiej Gramatyki</title>
  <!-- версия сайта: метка ?v= у всех наших файлов (защита от кэша); меняет tools/bump-version.js -->
  <script>window.POLSKI_V = '20261104-2140';</script>
  <link rel="icon" href="favicon.svg?v=20261104-2140" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261104-2140">
  <script src="core/settings.js?v=20261104-2140"></script> <!-- тема — до отрисовки; шестерёнка настроек -->
  <script src="core/account.js?v=20261104-2140" defer></script> <!-- вход через Google; без входа Firebase не грузится -->
  <script src="core/progress.js?v=20261104-2140" defer></script> <!-- очки в Firestore -->
</head>
<body class="test-page">
  <main>
    <a class="back" id="back" href="index.html">← Wstecz</a>
    <h1 id="title"></h1>
    <p class="subtitle test-mode" id="mode" hidden></p>
    <div class="card" id="app"></div>
  </main>

  <script src="core/engine.js?v=20261104-2140"></script>
  <script src="core/ui.js?v=20261104-2140"></script>
  <script src="tests/manifest.js?v=20261104-2140"></script>
  <script src="core/balance.js?v=20261104-2140"></script>
  <script src="journey/route.js?v=20261104-2140"></script>
  <script src="journey/journey.js?v=20261104-2140"></script> <!-- здесь только locate(): «следующий город» на итоге -->
  <script>
    (function () {
      var app = document.getElementById('app');
      var id = new URLSearchParams(location.search).get('id');

      if (!id) {
        Polski.ui.showError(app, 'Nie wybrano testu.');
        return;
      }

      var path = Polski.findPath(id);
      var entry = path && path[path.length - 1];
      if (!entry || Polski.isGroup(entry)) {
        Polski.ui.showError(app, 'Nie ma takiego testu: ' + id);
        return;
      }
      var parent = path[path.length - 2];
      if (parent) document.getElementById('back').href = 'index.html?g=' + encodeURIComponent(parent.id);

      Polski.loadBundles('', [entry]).then(function () {
        var test = Polski.tests[id];
        if (!test) throw new Error('Test „' + id + '” nie zarejestrował się.');
        // тест внутри раздела: заголовок — раздел («Niemęskoosobowe»), под ним — пункт («Liczebnik»)
        var heading = parent ? parent.title : test.title;
        document.title = (parent ? parent.title + ' · ' : '') + test.title + ' — Rajd Polskiej Gramatyki';
        document.getElementById('title').textContent = heading;
        if (parent) {
          var modeEl = document.getElementById('mode');
          modeEl.textContent = test.title;
          modeEl.hidden = false;
        }
        if (test.soon) {
          app.textContent = 'Test w przygotowaniu.';
          return;
        }
        Polski.ui.run(test, app, { backHref: document.getElementById('back').href });
      }).catch(function (err) {
        Polski.ui.showError(app, err);
      });
    })();
  </script>
</body>
</html>
